name: test-envoy

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          config: kind/cluster-envoy.yaml
          cluster_name: envoy-gw

      - name: Run Envoy Gateway tests
        env:
          KUBECONFIG: /home/runner/.kube/config
        run: bash scripts/verify-envoy.sh
