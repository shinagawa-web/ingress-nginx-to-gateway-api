apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: response-header
spec:
  parentRefs:
  - name: eg
  rules:
  - filters:
    - type: ResponseHeaderModifier
      responseHeaderModifier:
        add:
        - name: X-Custom-Header
          value: my-value
    backendRefs:
    - name: echo-v1
      port: 8080
