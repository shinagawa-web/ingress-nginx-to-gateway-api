apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: request-id
spec:
  parentRefs:
  - name: eg
  rules:
  - backendRefs:
    - name: echo-v1
      port: 8080
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyPatchPolicy
metadata:
  name: request-id-lua
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: eg
  type: JSONPatch
  jsonPatches:
  - type: "type.googleapis.com/envoy.config.listener.v3.Listener"
    name: "default/eg/http"
    operation:
      op: add
      path: "/default_filter_chain/filters/0/typed_config/http_filters/0"
      value:
        name: envoy.filters.http.lua
        typed_config:
          "@type": "type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua"
          default_source_code:
            inline_string: |
              function envoy_on_request(request_handle)
                local req_id = request_handle:headers():get("x-request-id")
                if req_id then
                  request_handle:streamInfo():dynamicMetadata():set("lua_ns", "req_id", req_id)
                end
              end
              function envoy_on_response(response_handle)
                local meta = response_handle:streamInfo():dynamicMetadata():get("lua_ns")
                if meta and meta["req_id"] then
                  response_handle:headers():add("x-request-id", meta["req_id"])
                end
              end
