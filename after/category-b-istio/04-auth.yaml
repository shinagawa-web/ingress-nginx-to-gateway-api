apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: protected
spec:
  parentRefs:
  - name: istio-gw
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /protected
    backendRefs:
    - name: echo-v1
      port: 8080
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: auth
spec:
  selector:
    matchLabels:
      app: echo
      version: v1
  action: DENY
  rules:
  - when:
    - key: request.headers[authorization]
      notValues:
      - "Bearer valid-token"
